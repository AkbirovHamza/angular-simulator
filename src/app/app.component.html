<main class="landing-page">
  <section class="tour-section" aria-labelledby="tour-section__title">
    <img
      class="tour-section__image"
      src="images/BackGroundMountainsImg.svg"
      alt="Горный пейзаж"
    />
    <div class="tour-section__overlay"></div>

    <header class="header">
      <div class="container header__content">
        <a class="logo" href="#top" aria-label="РумТибет — на главную">
          <img class="logo__mountains" src="images/mountainsImg.svg" alt="" />
          <span>{{ logoName }}</span>
        </a>

        <nav class="navigation" aria-label="Основная навигация">
          <a href="#top">Главная</a>
          <a href="#guide">Про гида</a>
          <a href="#program">Программа тура</a>
          <a href="#price">Стоимость</a>
          <a href="#blog">Блог</a>
          <a href="#contacts">Контакты</a>
        </nav>

        <button class="consultation-button" type="button">Консультация</button>
      </div>
    </header>

    <div class="container tour-section__content" id="top">
      <h1 class="tour-section__title" id="tour-section__title">
        <span>Насладись прогулкой в горах</span>
        <span>с командой единомышленников</span>
      </h1>

      <form class="search-panel" aria-label="Подбор программы тура">
        <label class="search-field">
          <select name="location" aria-label="Локация для тура">
            <option value="" selected disabled>Локация для тура</option>
            <option value="caucasus">Кавказ</option>
            <option value="altai">Алтай</option>
            <option value="karelia">Карелия</option>
          </select>
          <span>выберите из списка</span>
        </label>

        <label class="search-field">
          <input name="date" type="date" aria-label="Дата похода" />
          <span>укажите дату</span>
        </label>

        <label class="search-field">
          <select name="participants" aria-label="Количество участников">
            <option value="" selected disabled>Участники</option>
            <option value="1">1 человек</option>
            <option value="2">2 человека</option>
            <option value="3">3 человека</option>
            <option value="4">4+ человека</option>
          </select>
          <span>выберите из списка</span>
        </label>

        <button class="search-panel__button" type="button">Найти программу</button>
      </form>
    </div>
  </section>
</main>
